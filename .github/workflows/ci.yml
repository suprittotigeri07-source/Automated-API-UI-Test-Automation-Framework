name: CI Test Automation Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  quality-and-tests:
    name: Code Quality and Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Code Quality Checks (Ruff, Black, MyPy)
        run: |
          ruff check src tests conftest.py
          black --check src tests conftest.py
          mypy src tests conftest.py

      - name: Install Playwright Browsers
        run: |
          python -m playwright install --with-deps chromium

      - name: Execute Full PyTest Suite
        run: |
          pytest -ra -v --html=reports/report.html --self-contained-html --alluredir=reports/allure-results

      - name: Upload Test Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-execution-report
          path: |
            reports/
            screenshots/
            logs/
